name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'open.mp'
    tags:
      - 'v*'
      - 'SV-*'
  pull_request:
    branches:
      - '*'

jobs:
  build-windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.23.2'

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_CLIENT=ON .. -A Win32
          cmake --build . --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sampvoice-win-release.zip
          path: |
            build/server/Release/sampvoice.dll
            build/client/Release/

  build-linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: |
          cd docker
          chmod +x ./build.sh
          chmod +x ./docker-entrypoint.sh
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sampvoice-linux-release.zip
          path: docker/build/server/sampvoice.so

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/SV-')
    needs: [build-windows-release, build-linux-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sampvoice-win-release.zip
          path: release-files/win/
      - uses: actions/download-artifact@v4
        with:
          name: sampvoice-linux-release.zip
          path: release-files/linux/
      - name: Package files
        run: |
          mkdir -p dist
          cp release-files/win/sampvoice.dll dist/sampvoice.dll
          cp release-files/linux/sampvoice.so dist/sampvoice.so
          cd dist && zip -r ../sampvoice-server-binaries.zip . && cd ..

          mkdir -p client-dist
          cp -r release-files/win/* client-dist/
          rm -f client-dist/sampvoice.dll
          cp release-files/win/bass.dll "client-dist/bass.dll [0.3DL-R1]"
          cp release-files/win/bass.dll "client-dist/bass.dll [0.3.7-R1]"
          cp release-files/win/bass.dll "client-dist/bass.dll [0.3.7-R3]"
          cp release-files/win/bass.dll "client-dist/bass.dll [0.3.7-R5]"
          cp release-files/win/bass.dll "client-dist/bass.dll [open.mp]"
          cd client-dist && zip -r ../sampvoice-client.zip . && cd ..

          cp release-files/win/bass.dll "bass.dll [0.3DL-R1]"
          cp release-files/win/bass.dll "bass.dll [0.3.7-R1]"
          cp release-files/win/bass.dll "bass.dll [0.3.7-R3]"
          cp release-files/win/bass.dll "bass.dll [0.3.7-R5]"
          cp release-files/win/bass.dll "bass.dll [open.mp]"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/sampvoice.dll
            dist/sampvoice.so
            sampvoice-server-binaries.zip
            sampvoice-client.zip
            bass.dll*
